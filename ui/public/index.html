<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Services registered in Consul</title>
<style>
  :root {
    --bg: #0f172a;
    --bg-accent: #1e1b4b;
    --card: #1e293b;
    --card-hover: #26354d;
    --ink: #f1f5f9;
    --muted: #94a3b8;
    --line: #334155;
    --pass: #34d399;
    --pass-bg: rgba(16, 185, 129, 0.15);
    --crit: #f87171;
    --crit-bg: rgba(239, 68, 68, 0.15);
    --warn: #fbbf24;
    --warn-bg: rgba(245, 158, 11, 0.15);
    --link: #38bdf8;
    --accent: #818cf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top right, var(--bg-accent), var(--bg) 60%);
    color: var(--ink);
    font: 16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 48px 20px 60px; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }
  h1 {
    margin: 0;
    font-size: 1.75rem;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, #f8fafc, var(--accent));
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header p { margin: 6px 0 0; color: var(--muted); }
  a {
    color: var(--link);
    text-decoration: none;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 8px;
    background: rgba(56, 189, 248, 0.1);
    border: 1px solid rgba(56, 189, 248, 0.25);
    transition: background 0.2s, border-color 0.2s;
  }
  a:hover {
    background: rgba(56, 189, 248, 0.2);
    border-color: var(--link);
  }
  .panel {
    margin-top: 24px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.45);
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 15px 20px; text-align: left; }
  th {
    font-size: .8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    background: rgba(15, 23, 42, 0.45);
    border-bottom: 1px solid var(--line);
  }
  td { border-bottom: 1px solid var(--line); }
  tbody tr { transition: background 0.15s; }
  tbody tr:hover { background: var(--card-hover); }
  tr:last-child td { border-bottom: 0; }
  code {
    font: .9rem Consolas, "SFMono-Regular", Menlo, monospace;
    background: rgba(15, 23, 42, 0.65);
    color: var(--accent);
    padding: 4px 8px;
    border-radius: 6px;
    border: 1px solid var(--line);
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 4px 12px 4px 10px;
    border-radius: 999px;
    font-size: .85rem;
    font-weight: 600;
    border: 1px solid currentColor;
  }
  .pill::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 8px currentColor;
  }
  .passing  { color: var(--pass); background: var(--pass-bg); }
  .critical { color: var(--crit); background: var(--crit-bg); }
  .warning  { color: var(--warn); background: var(--warn-bg); }
  .empty { padding: 36px 20px; color: var(--muted); text-align: center; }
  .empty code { display: inline-block; margin-top: 10px; color: var(--ink); }
  .error {
    margin-top: 24px;
    padding: 14px 18px;
    border-radius: 12px;
    background: var(--crit-bg);
    color: var(--crit);
    border: 1px solid rgba(248, 113, 113, 0.35);
    font-weight: 600;
  }
  footer { margin-top: 14px; color: var(--muted); font-size: .85rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Services registered in Consul</h1>
      <p>Each service adds itself when it starts and removes itself when it stops.</p>
    </div>
    <a href="http://localhost:8500/ui" target="_blank" rel="noreferrer">Open the Consul UI</a>
  </header>

  <div id="error" class="error" role="alert" hidden></div>

  <div class="panel" id="panel">
    <table>
      <thead><tr><th>Service</th><th>Address</th><th>Health</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" hidden>
      No services are registered yet. Start one in a new terminal:
      <code>npm run product</code>
    </div>
  </div>
  <footer id="updated" aria-live="polite">Connecting…</footer>
</main>

<script>
  const rows = document.getElementById('rows');
  const empty = document.getElementById('empty');
  const errorBox = document.getElementById('error');
  const panel = document.getElementById('panel');
  const updated = document.getElementById('updated');
  const LABEL = { passing: 'Healthy', critical: 'Unhealthy', warning: 'Warning' };

  function cell(text, className) {
    const td = document.createElement('td');
    if (className) {
      const span = document.createElement('span');
      span.className = className;
      span.textContent = text;
      td.appendChild(span);
    } else {
      td.textContent = text;
    }
    return td;
  }

  async function refresh() {
    try {
      const response = await fetch('/api/services');
      const data = await response.json();
      if (!response.ok) throw new Error(data.error);
      errorBox.hidden = true;
      panel.hidden = false;
      rows.replaceChildren(...data.services.map(s => {
        const tr = document.createElement('tr');
        const name = cell(s.name);
        name.style.fontWeight = '600';
        const address = document.createElement('td');
        const code = document.createElement('code');
        code.textContent = `${s.address}:${s.port}`;
        address.appendChild(code);
        tr.append(name, address, cell(LABEL[s.status] || s.status, `pill ${s.status}`));
        return tr;
      }));
      empty.hidden = data.services.length > 0;
      updated.textContent = `Updated ${new Date().toLocaleTimeString()} · refreshes every 3 seconds`;
    } catch (error) {
      errorBox.textContent = error.message || 'Cannot reach the UI server.';
      errorBox.hidden = false;
      panel.hidden = true;
      updated.textContent = 'Not connected';
    }
  }

  refresh();
  setInterval(refresh, 3000);
</script>
</body>
</html>
